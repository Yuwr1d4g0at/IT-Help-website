    <!-- Nav -->
    <header class="wrap">
      <nav class="site-nav">

          <span class="brand-mark">Y</span>

    <!-- Page intro -->
    <section class="page-intro">
      <div class="wrap">
        <h1>O Que Se Passa Com o Seu PC?</h1>

      </div>

    <!-- Wizard -->
    <section class="section section-tight">

        <div class="wizard" id="wizard-root"></div>

  </div>

  <script>
    window.WIZARD_DATA = {
      ui: {
        eyebrow: "Diagnosticar",
        tipEyebrow: "Experimente isto primeiro",
        ctaEyebrow: "Vale a pena olhar com atenção",
        back: "← Voltar",
        startOver: "Recomeçar",
        contactCta: "Contacte-me",
        contactHref: "../../#contacto"
      },
      tree: {
        start: {
          question: "O que se está a passar com o seu computador?",
          options: [
            { label: "Não liga de todo", next: "power_1" },
            { label: "Está muito lento", next: "slow_1" },
            { label: "Bloqueia ou mostra um ecrã azul/preto", next: "crash_1" },
            { label: "Acho que tem um vírus", next: "virus_1" },
            { label: "Problemas de internet / Wi-Fi", next: "wifi_1" },
            { label: "Outra coisa", next: "other" }
          ]
        },
        power_1: {
          question: "Acontece alguma coisa quando carrega no botão de ligar: luzes, ventoinhas, sons?",
          options: [
            { label: "Nada de todo", next: "power_nothing" },
            { label: "Luzes/ventoinhas ligam, mas nada aparece no ecrã", next: "power_noDisplay" }
          ]
        },
        power_nothing: {
          question: "O cabo de alimentação está bem ligado nas duas pontas, e já experimentou outra tomada?",
          options: [
            { label: "Sim, experimentei, continua nada", next: "cta_hardware" },
            { label: "Ainda não experimentei", next: "tip_checkCable" }
          ]
        },
        tip_checkCable: {
          result: "tip",
          title: "Experimente isto primeiro",
          body: "Ligue o cabo diretamente a uma tomada de parede, sem usar nenhuma extensão ou ficha múltipla, e verifique se o próprio cabo tem danos. Se for um portátil com bateria removível, retire a bateria, mantenha o botão de ligar premido 30 segundos, e depois ligue à corrente e tente outra vez sem a bateria."
        },
        power_noDisplay: {
          question: "O monitor está ligado, e configurado para a entrada correta?",
          options: [
            { label: "Sim, já verifiquei", next: "cta_hardware" },
            { label: "Não tenho a certeza / ainda não verifiquei", next: "tip_checkMonitor" }
          ]
        },
        tip_checkMonitor: {
          result: "tip",
          title: "Experimente isto primeiro",
          body: "Certifique-se de que o monitor está ligado e configurado para a entrada correta (HDMI, DisplayPort, ou VGA, o que estiver realmente ligado). Experimente outro cabo ou porta, se tiver algum à mão."
        },
        slow_1: {
          question: "Ficou lento gradualmente ao longo do tempo, ou de repente, do nada?",
          options: [
            { label: "Gradualmente, ao longo de semanas ou meses", next: "slow_gradual" },
            { label: "De repente", next: "slow_sudden" }
          ]
        },
        slow_gradual: {
          result: "tip",
          title: "Causa provável: acumulação, não avaria",
          body: "Isto costuma ser demasiados programas a iniciar com o Windows, um disco quase cheio, ou simplesmente anos de acumulação. Experimente o BleachBit e o Microsoft PowerToys, e veja quanto espaço livre resta no disco principal. Menos de 10–15% livre já abranda bastante as coisas.",
          link: { href: "../software/", text: "Veja as ferramentas de limpeza que recomendo" }
        },
        slow_sudden: {
          result: "tip",
          title: "Vale a pena excluir: malware ou um disco a falhar",
          body: "Uma lentidão súbita é mais preocupante do que uma gradual. Faça uma verificação com o Malwarebytes, e veja a saúde do disco com o HWiNFO. Se a verificação estiver limpa e o disco estiver saudável mas continuar lento, vale a pena olhar com atenção.",
          link: { href: "../software/", text: "Encontre essas ferramentas na minha página de software" }
        },
        crash_1: {
          question: "Acontece aleatoriamente, ou só ao fazer algo específico, como jogar ou abrir um programa em concreto?",
          options: [
            { label: "Aleatoriamente, sem padrão claro", next: "crash_random" },
            { label: "Só numa tarefa específica", next: "crash_specific" }
          ]
        },
        crash_random: {
          result: "cta",
          title: "Este vale a pena olhar com atenção",
          body: "Crashes aleatórios e ecrãs azuis/pretos costumam estar relacionados com hardware: memória RAM, um disco, ou sobreaquecimento. Anote qualquer código de erro que veja (uma fotografia do ecrã ajuda bastante) e entre em contacto."
        },
        crash_specific: {
          result: "tip",
          title: "Experimente isto primeiro",
          body: "Isto costuma apontar para um problema de driver ou software com esse programa específico. Os drivers gráficos são o culpado mais comum. Experimente atualizar os drivers gráficos primeiro. Se continuar a acontecer depois disso, vale a pena olhar com mais atenção."
        },
        virus_1: {
          question: "Está a ver mensagens de resgate, ficheiros bloqueados, ou pop-ups a exigir pagamento?",
          options: [
            { label: "Sim", next: "virus_ransom" },
            { label: "Não, só está estranho, lento, ou com pop-ups esquisitos", next: "virus_general" }
          ]
        },
        virus_ransom: {
          result: "cta",
          title: "Pare e desligue-se da rede",
          body: "Desligue o computador da internet já (desligue o cabo ou o Wi-Fi) e não pague nada. Não tente resolver isto sozinho; entre em contacto assim que puder."
        },
        virus_general: {
          result: "tip",
          title: "Experimente isto primeiro",
          body: "Faça uma verificação completa com o Malwarebytes, e depois uma segunda opinião com o Microsoft Defender. Não clique em nada dentro de pop-ups. Feche-os pela barra de tarefas ou pelo gestor de tarefas, em vez de clicar em qualquer botão dentro do próprio pop-up.",
          link: { href: "../software/", text: "Obtenha o Malwarebytes na minha página de software" }
        },
        wifi_1: {
          question: "É só este dispositivo, ou a internet está em baixo para tudo, telemóveis incluídos?",
          options: [
            { label: "Só este computador", next: "wifi_oneDevice" },
            { label: "Está tudo em baixo", next: "wifi_everything" }
          ]
        },
        wifi_everything: {
          result: "tip",
          title: "Este é do router, não do PC",
          body: "Reinicie o router: desligue-o, espere 30 segundos, volte a ligar, e dê-lhe uns minutos. Se continuar em baixo para todos os dispositivos depois disso, é uma chamada para o seu fornecedor de internet, não uma reparação de computador."
        },
        wifi_oneDevice: {
          result: "tip",
          title: "Experimente isto primeiro",
          body: "Esqueça a rede Wi-Fi nesse computador e volte a ligar-se do zero. Se isso não ajudar, pode ser um problema de driver com o adaptador Wi-Fi, e vale a pena trazer se reiniciar e voltar a ligar não resolver."
        },
        other: {
          result: "cta",
          title: "Vamos só falar sobre isso",
          body: "Nem todos os problemas encaixam perfeitamente numa checklist, e não faz mal. Diga-me o que se passa e eu descubro o melhor próximo passo."
        },
        cta_hardware: {
          result: "cta",
          title: "Isto precisa de uma vista de olhos a sério",
          body: "A este ponto é provavelmente um problema de hardware que precisa de diagnóstico presencial, e é exatamente isso que eu faço. Entre em contacto e resolvemos isto."
        }
      }
    };
  </script>
  <script src="../../js/wizard.js"></script>
</body>
