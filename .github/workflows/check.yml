name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages in sync, links, sitemap, search index, no em-dashes
        run: node scripts/sync.mjs --check
